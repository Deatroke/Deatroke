name: Gerar estatísticas

on:
  schedule:
    - cron: "0 4 * * *"   # todo dia às 04:00 UTC (1h depois do jogo, para não dar conflito)
  workflow_dispatch:       # permite rodar manualmente pela aba Actions

permissions:
  contents: write          # deixa a Action salvar as imagens no repositório

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      # 1) Card geral: commits, PRs, issues, repositórios, seguidores
      - name: Estatísticas gerais
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}   # seu token, guardado como secret
          user: Deatroke
          filename: stats.svg
          template: classic
          base: header, activity, community, repositories
          repositories_affiliations: owner, collaborator, organization_member
          config_timezone: America/Sao_Paulo

      # 2) Card de linguagens mais usadas (inclui privados que o token enxergar)
      - name: Linguagens mais usadas
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Deatroke
          filename: languages.svg
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          repositories_affiliations: owner, collaborator, organization_member
          config_timezone: America/Sao_Paulo
